name: Code Quality Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1'  # 每周一凌晨2点全量扫描

jobs:
  quality-check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install qguard
        run: |
          pip install -e ./code-quality-guard

      - name: Run quality gate
        run: |
          python3 code-quality-guard/scripts/qguard.py gate . --min-score 70 --max-files 100

      - name: Generate quality report
        if: always()
        run: |
          python3 code-quality-guard/scripts/qguard.py review . --max-files 50 --json > ${{ github.workspace }}/quality-report.json
          python3 code-quality-guard/scripts/qguard.py metrics --last 7 --json > ${{ github.workspace }}/quality-metrics.json

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('${{ github.workspace }}/quality-report.json', 'utf8'));
              const scores = report.results || [];
              const avg = scores.reduce((a, b) => a + b.composite_score, 0) / scores.length;
              const grade = avg >= 90 ? '🟢 Excellent' : avg >= 70 ? '🟡 Good' : avg >= 50 ? '🟠 Fair' : '🔴 Poor';
              const message = `## Code Quality Report\n\n**Average Score: ${avg.toFixed(1)}/100** (${grade})\n\n| File | Score | Status |\n|------|-------|--------|\n${scores.slice(0, 10).map(r => `| ${r.file} | ${r.composite_score.toFixed(1)} | ${r.gate === 'auto-approve' ? '✅' : r.gate === 'conditional-pass' ? '⚠️' : '❌'} |`).join('\n')}\n\n---\n*Generated by Code Quality Guard v4*`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            } catch (e) {
              console.log('Failed to post comment:', e.message);
            }

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            ${{ github.workspace }}/quality-report.json
            ${{ github.workspace }}/quality-metrics.json

  threat-scan:
    name: STRIDE Threat Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run threat model
        run: |
          python3 code-quality-guard/scripts/qguard.py threats src/ --max-files 50 --json > threats.json
      - name: Fail on critical threats
        run: |
          python3 -c "
          import json, sys
          threats = json.load(open('threats.json'))
          critical = [t for t in threats if t['severity'] == 'critical']
          if critical:
            print(f'Found {len(critical)} critical threats')
            for t in critical[:5]:
              print(f'  - [{t[\"category\"]}] L{t[\"line\"]}: {t[\"description\"]}')
            sys.exit(1)
          print(f'No critical threats found ({len(threats)} total warnings)')
          "

  distill:
    name: Pattern Distillation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Distill patterns
        run: |
          python3 code-quality-guard/scripts/qguard.py distill src/ --max-files 30 --output distillation/patterns.json
      - name: Commit distilled patterns
        run: |
          git config user.name "quality-bot"
          git config user.email "bot@ryan.local"
          git add code-quality-guard/distillation/
          git diff --cached --quiet || git commit -m "chore: distill new patterns" || true
