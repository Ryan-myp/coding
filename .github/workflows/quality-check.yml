name: Code Quality Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Python analysis
        run: |
          python scripts/ast_analyzer.py src/ --output .qguard/python-result.json
      
      - name: Run TypeScript analysis
        run: |
          python scripts/ts_analyzer.py src/ --output .qguard/ts-result.json 2>/dev/null || echo "No TypeScript files"
      
      - name: Run security analysis
        run: |
          python scripts/security_analyzer.py src/ --language python --output .qguard/security-result.json
      
      - name: Check quality gate
        run: |
          python scripts/qguard.py gate . --min-score 60 --verbose
      
      - name: Generate report
        run: |
          mkdir -p .qguard/reports
          python scripts/generate_report.py .qguard/ --output .qguard/reports/quality-report.md
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: .qguard/reports/
-report
          path: .qguard/reports/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run security analysis
        run: |
          python scripts/security_analyzer.py . --recursive --language python
      
      - name: Check for vulnerabilities
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit || true
          fi
          if [ -f "package.json" ]; then
            npm audit || true
          fi
